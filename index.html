<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- safe areas; no pinch zoom -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>ShinyFlakes</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // replaceAll polyfill (old WebViews)
      if (!String.prototype.replaceAll) {
        Object.defineProperty(String.prototype, "replaceAll", {
          configurable: true,
          writable: true,
          value: function (pattern, replacement) {
            if (pattern instanceof RegExp) {
              if (!pattern.global) {
                throw new TypeError(
                  "replaceAll must be called with a global RegExp"
                );
              }
              return String(this).replace(pattern, replacement);
            }
            var subject = String(this);
            var needle = String(pattern);
            if (typeof replacement !== "function") {
              return subject.split(needle).join(replacement);
            }
            if (needle === "") return subject;
            var out = "";
            var from = 0;
            var at;
            while ((at = subject.indexOf(needle, from)) !== -1) {
              out += subject.slice(from, at) + replacement(needle, at, subject);
              from = at + needle.length;
            }
            return out + subject.slice(from);
          },
        });
      }

      // start-up watchdog
      (function () {
        var problems = [];
        window.__SF_PROBLEMS__ = problems;
        function note(label, detail) {
          problems.push(label + ": " + detail);
        }

        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target !== window && (e.target.src || e.target.href)) {
              note("failed to load", e.target.src || e.target.href);
            } else {
              note(
                "error",
                (e.message || e.type) +
                  (e.filename ? " @ " + e.filename + ":" + e.lineno : "")
              );
            }
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          note("rejection", (e.reason && (e.reason.message || e.reason)) || "unknown");
        });
        document.addEventListener("securitypolicyviolation", function (e) {
          note("blocked by CSP", e.violatedDirective + " -> " + e.blockedURI);
        });

        function esc(v) {
          return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;");
        }

        function reportIfDead() {
          var app = document.getElementById("app");
          if (!app || app.childElementCount > 0) return;
          app.innerHTML =
            '<div style="color:#e8eaef;background:#14161b;font:13px/1.6 ' +
            'system-ui,sans-serif;padding:24px;min-height:100vh">' +
            '<div style="color:#ffc83d;font-size:17px;font-weight:600">' +
            "ShinyFlakes could not start</div>" +
            '<div style="margin-top:10px">Please send this text — it says ' +
            "exactly what failed.</div>" +
            '<div style="margin-top:14px;color:#ff8a8d;font:11px/1.5 ' +
            'monospace;word-break:break-all">' +
            (problems.length ? esc(problems.join("\n")) : "no error was reported") +
            "</div>" +
            '<div style="margin-top:14px;color:#939aa8;font:10px/1.4 ' +
            'monospace;word-break:break-all">' +
            esc(navigator.userAgent) +
            "</div></div>";
        }

        // arm on load, or on DOM ready if load never fires
        window.addEventListener("load", function () {
          setTimeout(reportIfDead, 5000);
        });
        document.addEventListener("DOMContentLoaded", function () {
          setTimeout(reportIfDead, 8000);
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
