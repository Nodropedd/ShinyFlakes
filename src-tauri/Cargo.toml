[package]
name = "shinyflakes"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Privacy-focused multi-chain wallet"
default-run = "shinyflakes"

[lib]
name = "shinyflakes_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Secrets at rest and in memory.
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
bip39 = { version = "2", default-features = false, features = [
  "std",
  "rand",
] }

# Key derivation and address encoding.
bip32 = "0.5"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"

# OS keychain holds the vault key, so the encryption key is never derived
# from anything the user could pick badly.
keyring = { version = "3", default-features = false, features = [
  "windows-native",
] }
monero = "0.21.0"
curve25519-dalek = "4.1.3"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "socks"] }
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
futures = "0.3.34"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = "0.4.46"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
